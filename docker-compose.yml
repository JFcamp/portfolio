services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: offline
      EMBEDDING_PROVIDER: offline
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
