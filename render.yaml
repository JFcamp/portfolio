# Render deployment for the backend RAG API.
# Embeddings run in-process via fastembed (ONNX, no torch, fits the free 512MB
# instance): no API key, no rate limits, deterministic — so the committed index
# always matches production. Only secret needed: LLM_API_KEY (Groq).
services:
  - type: web
    name: portfolio-rag-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # The index is pre-computed and committed. We do NOT re-ingest at startup;
    # the app loads the committed index and only embeds the user's query.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: FASTEMBED_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false           # Groq key (console.groq.com)
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: RETRIEVAL_TOP_K
        value: "10"
      - key: ALLOWED_ORIGINS
        sync: false           # e.g. https://jfcamp.github.io
      - key: PYTHON_VERSION
        value: "3.12"
