# Render deployment for the backend RAG API.
#
# MEMORY: the Free instance is 512MB. We do NOT load any local embedding model
# (that alone uses ~500MB and OOMs the process — the cause of failed deploys).
# Embeddings use the Gemini API (no RAM). The index is pre-computed & committed,
# so startup only loads it from disk and embeds the user's query via the API.
#
# SECRETS to set in the Render dashboard (Environment tab):
#   EMBEDDING_API_KEY — Google AI Studio key (starts with AIza...). NOT the Groq key.
#   LLM_API_KEY       — Groq key (starts with gsk_...).
services:
  - type: web
    name: portfolio-rag-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # Do NOT re-ingest at startup: load the committed index; only embed queries.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_API_KEY
        sync: false           # Google AI Studio key (AIza...), NOT Groq
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false           # Groq key (console.groq.com)
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: RETRIEVAL_TOP_K
        value: "10"
      - key: ALLOWED_ORIGINS
        sync: false           # e.g. https://jfcamp.github.io
      - key: PYTHON_VERSION
        value: "3.12"
