# Render deployment for the backend RAG API.
# Uses Gemini's free embedding API (no local model, no torch, fits the free
# 512MB instance) + Groq's free tier for answer generation.
# Set two secrets in the Render dashboard: EMBEDDING_API_KEY (Google AI Studio)
# and LLM_API_KEY (Groq). They can be the same Google key if you use Gemini for both.
services:
  - type: web
    name: portfolio-rag-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python ../scripts/ingest.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_API_KEY
        sync: false           # Google AI Studio key (aistudio.google.com)
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false           # Groq key (console.groq.com)
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: RETRIEVAL_TOP_K
        value: "6"
      - key: ALLOWED_ORIGINS
        sync: false           # e.g. https://jfcamp.github.io
      - key: PYTHON_VERSION
        value: "3.12"
